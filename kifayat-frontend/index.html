<!doctype html>
<html lang="en-PK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="application-name" content="Kifayat" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kifayat" />

    <!-- Default SEO — overridden per-route by react-helmet-async -->
    <title>Kifayat</title>
    <meta name="description" content="Kifayat — Pakistan's trusted online store for quality products. Shop electronics, fashion, home goods and more, delivered all across Pakistan. Flat delivery — Cheapest Delivery in Pakistan." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://kifayat.com" />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kifayat" />
    <meta property="og:locale" content="en_PK" />
    <meta property="og:title" content="Kifayat" />
    <meta property="og:description" content="Kifayat — Pakistan's trusted online store for quality products. Shop electronics, fashion, home goods and more, delivered all across Pakistan. Flat delivery — Cheapest Delivery in Pakistan." />
    <meta property="og:url" content="https://kifayat.com" />
    <meta property="og:image" content="https://kifayat.com/og-default.jpg" />
    <meta property="og:image:secure_url" content="https://kifayat.com/og-default.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kifayat" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@kifayatpk" />
    <meta name="twitter:title" content="Kifayat" />
    <meta name="twitter:description" content="Kifayat — Pakistan's trusted online store for quality products. Shop electronics, fashion, home goods and more, delivered all across Pakistan. Flat delivery — Cheapest Delivery in Pakistan." />
    <meta name="twitter:image" content="https://kifayat.com/og-default.jpg" />
    <meta name="twitter:image:alt" content="Kifayat — Pakistan's trusted online store" />

    <!-- Icons -->

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="color-scheme" content="dark light" />

    <!-- cache-flush marker: forces a fresh edge cache on every deploy -->

    <!-- DNS prefetch & preconnect for performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://kifayat.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: preload display font subset for faster LCP, load full set async -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" />
    </noscript>

    <!-- Full font stack loaded normally (non-blocking after preload) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
